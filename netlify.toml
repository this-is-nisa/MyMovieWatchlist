[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Proxy movie requests so the TMDB key stays on the server.
[[redirects]]
  from = "/api/tmdb/*"
  to = "/.netlify/functions/tmdb/:splat"
  status = 200

# React Router handles page paths. This must stay after the API rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
